name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inventory_svc
          POSTGRES_PASSWORD: inventory_local_pw
          POSTGRES_DB: inventory_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inventory_svc -d inventory_db"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://inventory_svc:inventory_local_pw@localhost:5432/inventory_db
      TEST_DATABASE_URL: postgresql://inventory_svc:inventory_local_pw@localhost:5432/inventory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations round-trip (run, revert, run)
        run: npm run migration:run && npm run migration:revert && npm run migration:run
      - name: Entities have no changes missing a migration
        run: npm run db:check-drift
      - name: Unit + integration tests (incl. concurrency / no-oversell)
        run: npm test
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime and migrate images (not pushed until Phase 7)
        run: |
          docker buildx build --target runtime -t ecommerce-inventory-service:${{ github.sha }} --load .
          docker buildx build --target migrate -t ecommerce-inventory-service-migrate:${{ github.sha }} --load .
