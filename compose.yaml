# Standalone dependencies for working on this service alone.
name: ecommerce-inventory-service

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inventory_svc
      POSTGRES_PASSWORD: inventory_local_pw
      POSTGRES_DB: inventory_db
    ports: ["5443:5432"]
    volumes: ["inventory-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_svc -d inventory_db"]
      interval: 5s
      retries: 20

volumes:
  inventory-pg:
